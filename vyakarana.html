<script>
/* ===== Devanagari phoneme engine ===== */
const V_IND={'अ':'a','आ':'ā','इ':'i','ई':'ī','उ':'u','ऊ':'ū','ऋ':'ṛ','ॠ':'ṝ','ऌ':'ḷ','ए':'e','ऐ':'ai','ओ':'o','औ':'au'};
const V_MAT={'ा':'ā','ि':'i','ी':'ī','ु':'u','ू':'ū','ृ':'ṛ','ॄ':'ṝ','ॢ':'ḷ','े':'e','ै':'ai','ो':'o','ौ':'au'};
const IND_OF={},MAT_OF={};
for(const k in V_IND)IND_OF[V_IND[k]]=k;
for(const k in V_MAT)MAT_OF[V_MAT[k]]=k;
const VIRAMA='्';
const VOWELS=['a','ā','i','ī','u','ū','ṛ','ṝ','ḷ','e','ai','o','au'];
const isV=p=>VOWELS.includes(p);
const isC=p=>typeof p==='string'&&p.length===1&&p>='क'&&p<='ह'||p==='ळ';
function toPh(s){
  s=s.replace(/[​-‍़]/g,'').trim();
  const out=[];
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(V_IND[ch]){out.push(V_IND[ch]);continue}
    if(isC(ch)){
      out.push(ch);
      const nx=s[i+1];
      if(nx===VIRAMA){i++;}
      else if(V_MAT[nx]){out.push(V_MAT[nx]);i++;}
      else out.push('a');
      continue;
    }
    if(ch==='ं')out.push('M');else if(ch==='ः')out.push('H');else if(ch==='ँ')out.push('~');
    else if(ch==='ऽ')out.push("'");else if(ch===' ')out.push(' ');
    else out.push(ch);
  }
  return out;
}
function fromPh(ph){
  let s='';
  for(let i=0;i<ph.length;i++){
    const p=ph[i];
    if(isC(p)){
      s+=p;const nx=ph[i+1];
      if(isV(nx)){if(nx!=='a')s+=MAT_OF[nx];i++;}
      else s+=VIRAMA;
      continue;
    }
    if(isV(p)){s+=IND_OF[p];continue}
    if(p==='M')s+='ं';else if(p==='H')s+='ः';else if(p==='~')s+='ँ';else if(p==="'")s+='ऽ';else s+=p;
  }
  return s;
}
/* consonant classes */
const VARGA=[['क','ख','ग','घ','ङ'],['च','छ','ज','झ','ञ'],['ट','ठ','ड','ढ','ण'],['त','थ','द','ध','न'],['प','फ','ब','भ','म']];
const vargaOf=c=>{for(let v=0;v<5;v++){const j=VARGA[v].indexOf(c);if(j>=0)return[v,j]}return null};
const VOICED_C=new Set(['ग','घ','ङ','ज','झ','ञ','ड','ढ','ण','द','ध','न','ब','भ','म','य','र','ल','व','ह']);
const isVoiced=p=>isV(p)||VOICED_C.has(p);
const LONG={a:'ā',i:'ī',u:'ū',ṛ:'ṝ',ā:'ā',ī:'ī',ū:'ū',ṝ:'ṝ'};
const BASE={a:'a',ā:'a',i:'i',ī:'i',u:'u',ū:'u',ṛ:'ṛ',ṝ:'ṛ',ḷ:'ḷ'};
/* ===== Sandhi ===== */
function sandhi(w1,w2){
  const A=toPh(w1),B=toPh(w2);
  if(!A.length||!B.length)return null;
  const x=A[A.length-1],y=B[0];
  const pre=A.slice(0,-1),post=B.slice(1);
  const R=(ph,name,type,sutra,note)=>({result:fromPh(ph),name,type,sutra,note});
  // ---- visarga ----
  if(x==='H'){

function natva(word){

  for(let i=0;i<ph.length;i++){
    const p=ph[i];
    if(p==='र'||p==='ष'||p==='ṛ'||p==='ṝ'){trig=true;continue}
    if(p==='न'&&trig&&i<ph.length-1&&isV(ph[i+1])){ph[i]='ण';trig=false;continue}

  }

}

  body:['सादरं प्रणम्यते यदहम् अत्र सम्यक् निवसामि। मम परीक्षाफलम् अधुना प्रकाशितम्। नवमकक्षायाम् अहम् प्रथमश्रेण्याम् उत्तीर्णः। सर्वेषु छात्रेषु मम प्रथमं स्थानमस्ति। अधुना कानिचित् पुस्तकानि क्रेतव्यानि सन्ति। विद्यालयस्य शुल्कमपि देयमस्ति। अतः पञ्चसहस्रं रूप्यकाणि शीघ्रतया प्रेषयन्तु भवन्तः।','अहं प्रत्यहं मातुः स्मरणं करोमि। अनुजः रमेशः कथम् अस्ति? भगिनी श्वेता प्रत्यहं पठनाय विद्यालयं गच्छति न वा। अहम् अवकाशे गृहम् आगमिष्यामि।','भवदाशीर्वचसां प्रतीक्षायाम्'],

 {p:'उत्साहः उदासीनता, निराशा चेति तिस्रः मनसः अवस्थाः। शिशवः सदा उत्साहशीलाः इति विदितमेव। युवानः अपि प्रायेण उत्साहशीलाः। अनेके वृद्धाः अपि तथैव। वयसः उत्साहस्य च नास्ति सम्बन्धः। उत्साहः मानवस्य सहजः स्वभावः। सः मनसः शरीरस्य च विकासाय भवति। शिशुः उत्साहेन सर्वं ग्रहीतुं, सर्वैः सह खादितुं सर्वैः सह खेलितुं च प्रवर्तते। प्रतिबन्धे कृते रोदिति। उपहासे कृते क्रोधं प्रकटयति किन्तु निराशो न भवति।',

 {p:'कस्मिंश्चित् प्रदेशे काचित् नदी प्रवहति स्म। नदीतीरे कश्चन संन्यासी स्वशिष्यैः सह आश्रमं निर्माय वसति स्म। एकदा संन्यासी शिष्यैः सह नद्याः अपरं तीरं गन्तुम् एकां नौकाम् आरूढवान्। वेगेन प्रवहन्त्यां नद्याम् अकस्मात् एका अपरा नौका शिलायाः घट्टनेन निमग्ना अभवत्। तेन तस्यां नौकायां स्थिताः सर्वे जनाः मरणं प्राप्तवन्तः। संन्यासी अकथयत्- तस्यां नौकायां स्थितेषु कश्चित् दुष्टः आसीत् इति मन्ये। अतः ते सर्वे मरणं प्राप्तवन्तः।',
  q:[['एकपदेन','संन्यासी कुत्र वसति स्म?','नदीतीरे'],['एकपदेन','अपरा नौका कस्याः घट्टनेन नद्यां निमग्ना अभवत्?','शिलायाः'],['पूर्णवाक्येन','संन्यासी नौकादुर्घटनायाः किं कारणं कथितवान्?','तस्यां नौकायां स्थितेषु कश्चित् दुष्टः आसीत्, अतः सर्वे मरणं प्राप्तवन्तः इति संन्यासी कथितवान्।'],['यथानिर्देशम्','‘सज्जनः’ इति पदस्य विपरीतार्थकपदम् अनुच्छेदात् चित्वा लिखत।','दुष्टः'],['यथानिर्देशम्','‘आरूढवान्’ इति क्रियायाः कर्तृपदम् अनुच्छेदात् चित्वा लिखत।','संन्यासी']]},
 {p:'प्रातःकालादारभ्य सायं पर्यन्तं मानवः अनेकानि कार्याणि करोति। एतेषु कार्येषु किं समीचीनं किं वा असमीचीनम् इति विषये शयनकाले अवश्यं चिन्तनीयम्। एतादृशेन आत्मावलोकनेन स्वकीये आचरणे अज्ञानेन अनवधानेन रागद्वेषाभ्यां वा यदि कश्चन प्रमादः सञ्जातः, अपचारः द्रोहो वा निष्पन्नः तर्हि तेषां परिमार्जनोपायः अवश्यम् आलोचनीयः। पश्चात्तापः अनुभवितव्यः। श्वः प्रभृति एतादृशं प्रमादं न करिष्यामि इति दृढसङ्कल्पः करणीयः।',
  q:[['एकपदेन','किं समीचीनम् किं वा असमीचीनम् इति विषये कदा आलोचनीयम्?','शयनकाले'],['एकपदेन','यदि अपचारः द्रोहः वा निष्पन्नः तदा कः अवश्यम् आलोचनीयः?','परिमार्जनोपायः'],['पूर्णवाक्येन','कः दृढसङ्कल्पः करणीयः?','श्वः प्रभृति एतादृशं प्रमादं न करिष्यामि इति दृढसङ्कल्पः करणीयः।'],['यथानिर्देशम्','अनुच्छेदे के पदे परस्परं विपरीतार्थे प्रयुक्ते?','समीचीनम् — असमीचीनम्']]},
 {p:'यः स्वदोषाणां कृते अनुतपति तस्य सत्पथगमनस्य द्वारम् उद्घाटितं भवति। अनुतापानलेन पापानि भस्मीभवन्ति, ग्लानिः नश्यति, चित्तं निर्मलं प्रसन्नं च भवति, सद्विचारः समुदेति। इत्थम् आत्मानुशीलनस्य महत्त्वं जीवने अनुभूयते। तेन कृतेषु कार्येषु त्रुटयः न भवन्ति। अतः कृतदोषोऽपि जनः अनुतप्य सत्कर्मसम्पादनेन जीवने महान् भवितुम् अर्हति।',
  q:[['एकपदेन','जीवने कस्य महत्त्वम् अनुभूयते?','आत्मानुशीलनस्य'],['एकपदेन','कृतदोषः जनः केन महान् भवितुं शक्नोति?','सत्कर्मसम्पादनेन'],['पूर्णवाक्येन','अनुतापानलेन किं किं भवति?','अनुतापानलेन पापानि भस्मीभवन्ति, ग्लानिः नश्यति, चित्तं निर्मलं प्रसन्नं च भवति, सद्विचारः समुदेति।'],['यथानिर्देशम्','‘एवम्’ इति अर्थे किं पदम् अनुच्छेदे प्रयुक्तम्?','इत्थम्'],['यथानिर्देशम्','‘अनुभूयते’ इति क्रियापदस्य कर्तृपदं किम्?','महत्त्वम्']]},
 {p:'कस्मिंश्चित् अरण्ये अनेके पशवः वसन्ति स्म। एकदा पशूनां राजा सिंहः रोगपीडितः अभवत्। एकं शृगालं विहाय सर्वे पशवः रोगपीडितं नृपं द्रष्टुमागताः। एकः उष्ट्रः नृपाय एतत् न्यवेदयत् यत् अहंकारिणं शृगालं विहाय सर्वे भवन्तं द्रष्टुमागताः। एतच्छ्रुत्वा सिंहः क्रोधितोऽभवत्। स्वमित्रैः एतज्ज्ञात्वा शृगालः शीघ्रमेव सिंहस्य समीपे प्राप्तः। क्रोधितेन सिंहेन विलम्बेन आगमनकारणं पृष्टः शृगालोऽवदत् यदहं तु सर्वप्रथममागन्तुम् ऐच्छम् परं चिकित्सकात् औषधमपि आनेयमिति विचिन्त्य तत्रागच्छम्। तच्छ्रुत्वा प्रसन्नः सिंहः औषधविषये पृष्टवान्। शृगालः अवदत् यत्तेन औषधं तु न दत्तं परं कृपापरो भूत्वा चिकित्साक्रमम् उक्तम् यत् उष्ट्रस्य रक्तपानेनैव रोगस्य शान्तिः भविष्यति। तदा सिंहः उष्ट्रमाहूतवान्। भक्त्या आगतं च तं मारयित्वा तस्य रक्तं पीतवान्। एवं स्वपिशुनतायाः दुष्फलम् उष्ट्रेण स्वयमेव प्राप्तम्।',
  q:[['एकपदेन','चिकित्सकेन किम् उक्तमासीत्?','चिकित्साक्रमम्'],['एकपदेन','शृगालः शीघ्रमेव कस्य समीपे प्राप्तः?','सिंहस्य'],['एकपदेन','उष्ट्रेण कस्याः दुष्फलम् प्राप्तम्?','स्वपिशुनतायाः'],['एकपदेन','अनेके पशवः कुत्र वसन्ति स्म?','अरण्ये'],['पूर्णवाक्येन','क्रोधितेन सिंहेन किं पृष्टम्?','क्रोधितेन सिंहेन शृगालः विलम्बेन आगमनस्य कारणं पृष्टः।'],['पूर्णवाक्येन','चिकित्सकेन कीदृशं चिकित्साक्रमम् उक्तम्?','उष्ट्रस्य रक्तपानेनैव रोगस्य शान्तिः भविष्यति इति चिकित्साक्रमम् उक्तम्।'],['पूर्णवाक्येन','कं विहाय सर्वे सिंहं द्रष्टुमागच्छन्?','एकं शृगालं विहाय सर्वे पशवः सिंहं द्रष्टुमागच्छन्।'],['पूर्णवाक्येन','सिंहः उष्ट्रमाहूय किं कृतवान्?','सिंहः उष्ट्रं मारयित्वा तस्य रक्तं पीतवान्।'],['यथानिर्देशम्','‘प्रसन्नः सिंहः’ इति अत्र विशेष्यपदं किम्?','सिंहः'],['यथानिर्देशम्','‘त्यक्त्वा’ इत्यर्थे किं पदम् अनुच्छेदे प्रयुक्तम्?','विहाय']]},
 {p:'अमर्त्यसेनः इति नाम एव संस्कृतमयम्। अमर्त्यसेनवर्यस्य जन्म शान्तिनिकेतने अभवत्। अस्य नाम गुरुदेवेन रवीन्द्रनाथवर्येण चितम्। अस्य नाम निर्दिशन् सः उक्तवान् आसीत्— "अमर्त्यसेनः" इत्येषः शब्दः संस्कृतमूलः अतः एतस्य उच्चारणं स्पष्टं स्यात्, यतः अर्थपरिवर्तनं न भवेत्। शान्तिनिकेतने वसन् अमर्त्यसेनः बाल्ये संस्कृताभ्यासं कृतवान्। तस्य तीव्रः अभिलाषः अपि आसीत् यत् मातामहः क्षितिमोहनसेन इव अहम् अपि प्रसिद्धः संस्कृतविद्वान् भवेयम् इति।',
  q:[['एकपदेन','अमर्त्यसेनस्य मातामहस्य नाम किम् आसीत्?','क्षितिमोहनसेनः'],['एकपदेन','कुत्र वसन् अमर्त्यसेनः संस्कृताभ्यासं कृतवान् आसीत्?','शान्तिनिकेतने'],['एकपदेन','अमर्त्यसेनस्य नाम केन चितम्?','रवीन्द्रनाथवर्येण'],['एकपदेन','किं भवितुम् अमर्त्यसेनस्य तीव्रः अभिलाषः आसीत्?','संस्कृतविद्वान्'],['पूर्णवाक्येन','अमर्त्यसेनस्य नामविषये निर्दिशन् रवीन्द्रनाथवर्यः किमुक्तवान्?','“अमर्त्यसेनः” इत्येषः शब्दः संस्कृतमूलः अतः एतस्य उच्चारणं स्पष्टं स्यात्, यतः अर्थपरिवर्तनं न भवेत् — इति रवीन्द्रनाथवर्यः उक्तवान्।'],['यथानिर्देशम्','‘अस्य नाम’ इत्यत्र ‘अस्य’ इति पदं कस्मै प्रयुक्तम्?','अमर्त्यसेनाय'],['यथानिर्देशम्','‘स्यात्’ इत्यर्थे किं क्रियापदम् अनुच्छेदे प्रयुक्तम्?','भवेत्'],['यथानिर्देशम्','अस्य अनुच्छेदस्य कृते समुचितं शीर्षकं लिखत।','अमर्त्यसेनस्य संस्कृतप्रेम']]},
 {p:'कदाचित् देवराजः इन्द्रः भूलोकम् आगतवान्। भूलोके कमपि नगरं प्रविष्टः सः मार्गे गच्छन् आसीत्। तत्र कश्चन विक्रेता बहूनां देवानां विग्रहान् संस्थाप्य विक्रयणं करोति स्म। देवेन्द्रः कुतूहलेन समीपं गत्वा दृष्टवान् तत्र विष्णुः, शिवः, लक्ष्मीः, सरस्वती, गणेशः इत्यादीनां देवानां विग्रहाः आसन्। देवेन्द्रस्य विग्रहः अपि तत्र आसीत्। देवेन्द्रः एकैकस्यापि विग्रहस्य मूल्यं पृष्ट्वा-पृष्ट्वा ज्ञातवान्। अन्ते च कुतूहलेन तत्र स्थितस्य देवेन्द्रविग्रहस्य मूल्यं पृष्टवान्। सः विक्रेता उक्तवान्— यः कोऽपि कमपि विग्रहं क्रीणाति तस्मै एषः देवेन्द्र-विग्रहः निःशुल्कं दीयते इति। तदा तु देवेन्द्रस्य स्थितिः शोचनीया एव आसीत्।',
  q:[['एकपदेन','देवराजः कुत्र आगतवान्?','भूलोकम्'],['एकपदेन','कस्य स्थितिः शोचनीया आसीत्?','देवेन्द्रस्य'],['पूर्णवाक्येन','विक्रेता तत्र केषां देवानां विग्रहान् स्थापितवान्?','विक्रेता तत्र विष्णुः, शिवः, लक्ष्मीः, सरस्वती, गणेशः इत्यादीनां देवानां विग्रहान् स्थापितवान्।'],['पूर्णवाक्येन','देवेन्द्रविग्रहं कस्मै निःशुल्कं दीयते?','यः कोऽपि कमपि विग्रहं क्रीणाति तस्मै देवेन्द्रविग्रहः निःशुल्कं दीयते।'],['यथानिर्देशम्','‘स्थितिः शोचनीया’ अत्र विशेषणपदं किम्?','शोचनीया'],['यथानिर्देशम्','‘अपश्यत्’ इत्यर्थे किं क्रियापदम् अनुच्छेदे प्रयुक्तम्?','दृष्टवान्'],['यथानिर्देशम्','अस्य अनुच्छेदस्य कृते समुचितं शीर्षकं लिखत।','देवेन्द्रस्य कुतूहलम्']]},
 {p:'हरियाणाराज्ये यमुनानगरमण्डले एकः संस्कृतपरिवारः अस्ति। तस्मिन् गृहे सर्वे संस्कृते सम्भाषणं कुर्वन्ति। तत्र पशवोऽपि संस्कृतम् अवबोद्धुं समर्थाः सन्ति। तस्मिन् गृहे अभिमन्युः नाम एकः युवकः अस्ति। सोऽपि संस्कृतं वदति। एकदा तत्र एकः संस्कृतप्राध्यापकः आगतवान्। तेन सह अभिमन्युः संस्कृतेन सम्भाषणं कृतवान्। तस्य युवकस्य प्रतिभां दृष्ट्वा प्राध्यापकः अभिमन्यवे शतं रूप्यकाणि दत्तवान्। तस्मात् दिनात् तस्य मनसि संस्कृतं प्रति महती अभिरुचिः समुत्पन्ना। सः प्रतिदिनं गीतायाः श्लोकान् पठित्वा-पठित्वा सर्वान् श्लोकान् अस्मरत्।',
  q:[['एकपदेन','संस्कृतपरिवारः कुत्र अस्ति?','यमुनानगरमण्डले'],['एकपदेन','प्राध्यापकः कस्मै शतं रूप्यकाणि दत्तवान्?','अभिमन्यवे'],['पूर्णवाक्येन','प्राध्यापकः अभिमन्यवे शतं रूप्यकाणि किमर्थं दत्तवान्?','तस्य युवकस्य प्रतिभां दृष्ट्वा प्राध्यापकः अभिमन्यवे शतं रूप्यकाणि दत्तवान्।'],['पूर्णवाक्येन','युवकः कथं गीतायाः श्लोकान् अस्मरत्?','सः प्रतिदिनं गीतायाः श्लोकान् पठित्वा-पठित्वा सर्वान् श्लोकान् अस्मरत्।'],['यथानिर्देशम्','‘अयच्छत्’ इत्यर्थे किं क्रियापदम् अनुच्छेदे प्रयुक्तम्?','दत्तवान्'],['यथानिर्देशम्','‘कृतवान्’ इति क्रियापदस्य कर्तृपदं चित्वा लिखत।','अभिमन्युः'],['यथानिर्देशम्','अस्य अनुच्छेदस्य कृते समुचितं शीर्षकं लिखत।','संस्कृतपरिवारः']]},
 {p:'एकस्मिन् दिने बहवः जिज्ञासवः तत्त्वज्ञानं श्रोतुं महात्मनः सुकरातस्य गृहम् आगच्छन्। ज्ञानचर्चां शृण्वतां तेषां भूयान् कालः व्यतियातः। सुकरातस्य पत्नी गृहेऽपेक्षितानां वस्तूनाम् अभावचर्चां चिकीर्षति स्म, किन्तु तत्र उपस्थिते जनसमवाये एतत् सुकरं नासीत्। ततः कोपविहितचेतना सा अपशब्दान् उच्चारयन्ती तत्र समायाता, आगन्तुकेषु च पयः पातयन्ती प्रतिनिवृत्ता। सुकरातः सर्वान् सम्बोधयन् सस्मितम् उवाच, श्रुतम् एव भवद्भिर्यत् ये मेघाः गर्जन्ति, ते न वर्षन्ति, किन्तु अद्य प्रकृत्यां विपर्यासः परिलक्षितो भवति, मेघाः गर्जन्ति वर्षन्ति च।',
  q:[['एकपदेन','के महात्म-सुकरातस्य गृहम् आगच्छन्?','जिज्ञासवः'],['एकपदेन','सुकरातस्य पत्नी आगन्तुकेषु किं पातयन्ती प्रतिनिवृत्ता?','पयः'],['पूर्णवाक्येन','सुकरातस्य पत्नी किं चिकीर्षति स्म?','सुकरातस्य पत्नी गृहेऽपेक्षितानां वस्तूनाम् अभावचर्चां चिकीर्षति स्म।'],['पूर्णवाक्येन','सुकरातस्य मते प्रकृत्यां कः विपर्यासः परिलक्षितः?','ये मेघाः गर्जन्ति ते न वर्षन्ति, किन्तु अद्य मेघाः गर्जन्ति वर्षन्ति च — अयं विपर्यासः परिलक्षितः।'],['यथानिर्देशम्','‘कोपविहितचेतना सा’ इति पदे अनुच्छेदे कस्यै प्रयुक्ते?','सुकरातस्य पत्न्यै'],['यथानिर्देशम्','‘अनेके’ इत्यर्थे किं पदम् अनुच्छेदे प्रयुक्तम्?','बहवः'],['यथानिर्देशम्','अस्य गद्यांशस्य समुचितं शीर्षकं लिखत।','सुकरातस्य धैर्यम्']]}

 {t:'नैतिकशिक्षायाः महत्त्वम्',x:'‘शिक्ष’ ‘विद्योपादाने’ इति व्युत्पत्त्या शिक्षाशब्दस्य अर्थः विद्यार्जनम् एव किन्तु केवलानि पुस्तकानि कण्ठस्थीकृत्य उपाधिं प्राप्य जीविकोपार्जनम् एव शिक्षा नास्ति। जीवने सत्यम्, अहिंसा, विनम्रतानियमसाहसप्रभृतीनाम् उच्चादर्शाणाम् सम्यक् समावेशनम् एव शिक्षायाः उद्देश्यं भवति। यया शिक्षया एतादृशाणां सद्गुणानां विकासः भवति सा नैतिकशिक्षेति उच्यते। नैतिकशिक्षामाध्यमेन मानवानां मूलप्रवृत्तयः संशोध्यन्ते। नैतिकशिक्षया सङ्कीर्णानां विचाराणाम् अपनयनं भवति। उचितानुचितनिर्णयक्षमतायाः विकासोऽपि भवति। सम्प्रति लोके चौर्यहिंसाबलात्कार—घृणाद्वेषादिघृणितप्रवृत्तयः अनियन्त्रणीयाः सञ्जाताः। अतः अस्माभिः मूलप्रवृत्तीनां संयमनम् अवश्यं कर्तव्यम्। नैतिकशिक्षाबलेन एव वयं गतगौरवं पुनः प्राप्तुं शक्नुमः।'},
 {t:'महामना मदनमोहनमालवीयः',x:'महामनामदनमोहनमालवीयमहोदयः वैदिकधर्मस्य उद्धारकेषु अन्यतमः। 1869 तमे वर्षे प्रयागसमीपवर्तिनि ग्रामे ब्राह्मणकुले मदनमोहनमालवीयमहोदयानां जन्म अभवत्। सः प्रयागस्थ-म्योर-सेंट्रल-महाविद्यालये शिक्षां प्राप्तवान्। 1884 वर्षात् आरभ्य 1887 वर्षपर्यन्तं सः उच्चविद्यालये अध्यापकरूपेण कार्यं कृतवान्। तदनन्तरं सः अनेकानां पत्रपत्रिकाणां सम्पादकरूपेण कार्यं कृतवान्। 1899 तमे वर्षे सः विधिशास्त्रस्य परीक्षाम् उत्तीर्य अधिवक्तृरूपेण अपि कार्यं कृतवान्। राष्ट्रीयताप्रसारणाय, प्राचीनसंस्कृतेः गौरववर्धनाय उत्तमशिक्षाया च श्रेष्ठसन्ततिनिर्माणाय च सः 1916 तमे वर्षे काश्यां हिन्दूविश्वविद्यालयस्य स्थापनाम् अकरोत्। यद्यपि 1946 तमे वर्षे मालवीयमहोदयाः दिवंगताः परं तेषाम् नाम हिन्दूविश्वविद्यालयमाध्यमेन अद्यापि श्रद्धया स्मर्यते।'},
 {t:'सत्सङ्गतिः',x:'सताम् सङ्गतिः इति सत्सङ्गतिः कथ्यते। मनुष्यः स्वसंगत्या एव सज्जनः दुर्जनो वा भवति। यो जनः दुर्जनानाम् संसर्गे अधिकं कालं यापयति, सोऽपि दुर्जनः भवति। सुमनः सङ्गात् कीटः अपि सतां शिरसि आरोहति, परं यदि कोऽपि सज्जनः अपि चौराणाम् संसर्गे कालं यापयति तदा आरक्षिभिः सोऽपि चौरः एव कथ्यते। अत एव अस्माभिः सर्वदा सत्सङ्गतिः एव करणीया।'},
 {t:'परोपकारः',x:'परेषाम् उपकारः परोपकारः अस्ति। परोपकारप्रवृत्त्या एव मनुष्यः पशुभ्यः पृथक् भवति। आहारादिप्रवृत्तयः तु पशुषु अपि तथैव भवन्ति यथा मानवेषु। परं मानवः स्वविवेकेन उचितानुचितज्ञानेन एव आत्मानम् उच्चासने उच्चपदे च स्थापयति। वृक्षाः स्वयं फलं न खादन्ति, ते परेषां कृते एव फलानि छायाः च ददति। नद्यः परोपकाराय एव वहन्ति, गावः अन्येभ्यः एव दुग्धं यच्छन्ति। एवमेव अनेके प्रातःस्मरणीयाः महापुरुषाः अपि अभवन् ये स्वप्राणान् उत्सृज्य देशस्य समाजस्य च रक्षाम् अकुर्वन्। राजा शिविः शरणागतस्य कपोतस्य रक्षायै स्वशरीरस्य मांसं कर्तयित्वा श्येनाय दत्तवान्। ऋषिः दधीचिः अपि वृत्रासुरवधाय स्वास्थीनि सहर्षम् अयच्छत्। अद्यापि लोके अनेके समाजसुधारकाः सन्ति ये स्वार्थं परित्यज्य लोककल्याणं कुर्वन्ति। अतः सत्यमेव कथितम्— अष्टादशपुराणेषु व्यासस्य वचनद्वयम्। परोपकारः पुण्याय पापाय परपीडनम्॥'},
 {t:'छात्रजीवनम्',x:'यः विद्यार्जनं कर्तुम् इच्छति विद्यार्जने च संलग्नः भवति सः विद्यार्थी उच्यते। विद्याध्ययनाय छात्रः विद्यालयं गच्छति। सः सर्वविधं सुखं परित्यज्य अहर्निशं विद्याध्ययनं करोति। विद्यार्थी अल्पाहारी गृहत्यागी काकचेष्टावान् बकध्यानयुक्तः अल्पनिद्रालुश्च भवेत्। यथोक्तं केनापि कविना— काकचेष्टा बकध्यानं शुनो निद्रा तथैव च। अल्पाहारः गृहत्यागः विद्यार्थिपञ्चलक्षणम्॥ प्रमादं विहाय अध्ययनेन परिप्रश्नेन च विद्यार्थी विद्यार्थी भवितुं शक्नोति। तेन तपोमयजीवनम् अनुकरणीयम् इति।'}

 {t:'पर्यावरणम्',x:['अद्यत्वे हि विज्ञानमयं युगं वर्तते। जनैः सौविध्यार्थं नानोपकरणानि प्रयुज्यन्ते। तेषामुत्पादनं कार्यशालासु यन्त्रैः क्रियते। यातायातव्यवस्थायाः कृते विविधानि यानानि प्रयुज्यन्ते। यद्यपि एतैरस्माकं जीवनं सुखमयं भवति, परम् एभिः प्रसारितः धूमः वायुमण्डलम् अत्यन्तं दूषयति। एवमेव वनानां विनाशेन ऋतुचक्रं प्रभावितं भवति। वायुमण्डलस्य दुष्प्रभावितत्वात् अस्माकं शरीरमपि श्वासादिरोगैः रुग्णं भवति।','महानगराणां मलिनजलं नानाप्रवाहिकामाध्यमेन नदीं प्रविशति। अस्मात् कारणात् नदीनां स्वच्छमपि जलं मलिनम् अपेयं च भवति। साम्प्रतं पाश्चात्यदेशेषु पर्यावरणं प्रति जागरुकता समुत्पन्ना। तत्प्रेरिता भारतीयैरपि पर्यावरणदूषणस्य सङ्कटम् अवगत्य साम्प्रतं गंगा-यमुनादि-नदीनां कृते शुद्धीकरणकार्यक्रमाः प्रचाल्यन्ते। अस्माभिरपि आवश्यकेऽस्मिन् पर्यावरणरक्षाकार्यक्रमे वृक्षारोपणमाध्यमेन, स्वच्छतादिनियमानां पालनेन च योगदानं विधेयम्।']},
 {t:'दूरदर्शनम्',x:['कालोऽयं विज्ञानमयः। विज्ञानस्य विभिन्नोपकरणैः मानवजीवनम् अतितरां सौविध्यमनुभवति। विज्ञानक्षेत्रे ये आविष्काराः संजाताः तेषु दूरदर्शनं सर्वान् अतिशेते।','अद्यत्वे एकत्र स्थितः मानवः एतदुपकरणमाध्यमेन दूरस्थिताः घटनाः वीक्षितुं शक्नोति। अमेरिकादेशेन ईराकदेशे यद् आक्रमणम् कृतम् तस्य साक्षात्प्रसारणं दूरदर्शनयन्त्रमाध्यमेन तद्वत् प्रत्यक्षीकृतं, यथा हि पुरा महाभारतस्य युद्धं सञ्जयेन धृतराष्ट्रं प्रति वर्णितमासीत्।','दूरदर्शनेन न केवलं मनोरञ्जनमेव भवति, अपितु दैनिकघटनानां ज्ञानम् अपि एतेन भवति। विभिन्नाभिः प्रणालिकाभिः (चैनलैः) प्रतिक्षणं नूतन-नूतनवार्तानां प्रसारणं क्रियते। साम्प्रतं तु शिक्षाक्षेत्रेऽपि अस्य महान् उपयोगो विधीयते। ‘ज्ञानदर्शन’ इति कार्यक्रममाध्यमेन देशस्य सुदूरस्थक्षेत्रवास्तव्याः छात्राः अपि विद्यार्जनं कर्तुं पारयन्ति। दूरदर्शनेन तु साम्प्रतं प्रतिदिनं संस्कृतवार्ताः अपि प्रसार्यन्ते, एतत्प्रसारणं निशम्य लोकाः शुद्धं संस्कृतोच्चारणं कर्तुं पारयन्ति।','यद्यपि दूरदर्शनस्य नैके गुणाः सन्ति, परमत्र केचन अवगुणाः अपि सन्ति। अत्र प्रसार्यमाणानां कार्यक्रमाणाम् अधिकदर्शनेन नेत्रहानिः सम्भवति। बाल्यावस्थायामेव बालकाः उपनेत्राणि संधारयितुं विवशीभवन्ति।','एकोऽपरोऽतिदोषः वर्तते यत् प्रायशः ये मनोरञ्जककार्यक्रमाः प्रसार्यन्ते, तेषु सदाचारशिक्षायाः अभावो वर्तते। नैके कार्यक्रमाः केवलम् अनैतिकताम् मूल्यहानिं च प्रदर्शयन्ति। अतः अस्माभिः दूरदर्शनेन केवलम् गुणार्जनमेव विधेयम्।']},
 {t:'संस्कृतभाषायाः महत्त्वम्',x:['भारतवर्षे आदिकालादेव मानवानां व्यवहारे संस्कृतभाषायाः प्रयोगो भवति स्म। संस्कृतं विश्वस्य प्राचीनतमा भाषास्ति। श्रद्धावशादियं जनैः देववाणी सुरभारतीत्यपि कथ्यते। इयं भाषा भारतीयायाः सभ्यतायाः संस्कृतेः चिन्तनस्य च संवाहिकास्ति। संस्कृतं धर्मस्य, दर्शनस्य, राजनीतेः, इतिहासस्य, अर्थशास्त्रस्य नीतिशास्त्रस्य च मूलमस्ति।','अस्यां भाषायां भारतीयचिन्तनस्य सर्वे प्रमुखाः ग्रन्थाः उपनिबद्धाः सन्ति। विश्वसाहित्यस्य प्राचीनतमानां ग्रन्थानां वेदानामपि भाषा संस्कृतमेवास्ति। सम्पूर्णं वैदिकं वाङ्मयं ज्ञानविज्ञानदृष्ट्या समस्ते जगति निरुपमं विद्यते। अस्यां भाषायां दर्शनग्रन्थाः साहित्यग्रन्थास्तु उपनिबद्धाः सन्त्येव सहैव भौतिकविज्ञानस्य रसायनविज्ञानस्य, चिकित्साविज्ञानस्य, वनस्पतिविज्ञानस्य, भाषाविज्ञानस्य, वास्तुविज्ञानस्यापि अनेके मौलिकाः ग्रन्थाः विद्यन्ते।','संस्कृतभाषायाम् उपनिबद्धे साहित्ये सत्यस्य, अहिंसायाः, राष्ट्रभक्तेः, परस्परं सहयोगस्य, त्यागस्य, विश्वबन्धुत्वस्य, शान्तेश्च भावनानाम् अजस्रं स्रोतः प्रवहत् विद्यते। लोककल्याणाय अस्यां भाषायां बहवः आदर्शाः प्रस्तुताः सन्ति, यथा— ‘वसुधैव कुटुम्बकम्’, ‘सर्वे भवन्तु सुखिनः’, ‘तेन त्यक्तेन भुञ्जीथाः मा गृधः कस्यस्विद्धनम्’ इत्यादयः। एतेषामादर्शानामनुकरणं कृत्वा यः कोऽपि मानवः स्वजीवनम् उन्नतं कर्तुं शक्नोति।','विषयदृष्ट्या भाषासौष्ठवदृष्ट्या च इयं भाषा अन्यासु सर्वासु विश्वभाषासु अतिशेते। आधुनिकाः प्रायशः सर्वाः भारतीयाः भाषाः संस्कृतभाषायाः एव निर्गताः सन्ति।','संस्कृतसाहित्यमाश्रित्यैव आधुनिकं साहित्यमपि विकसितम्। अत एव इयं भाषा भारतीयभाषाणां जननी सम्पोषिका च कथ्यते। विश्वबन्धुत्वभावनां पोषयितुम्, भारतीयां संस्कृतिमवगन्तुम्, राष्ट्रियतायाः भावनां वर्धयितुम् भारतीयभाषाणां विकासाय च संस्कृतभाषायाः परमोपयोगिता विद्यते।']},
 {t:'भारतीया संस्कृतिः',x:['संस्कृतिः नाम संस्कारेण संस्करणं परिष्करणम् इति। यया संस्कृत्या सभ्यतया च भारतीयाः जनाः संस्कारं परिष्कारं च लभन्ते सा एव भारतीया संस्कृतिः। इयम् ‘आर्यसंस्कृतिः’ अपि उच्यते। एषा संस्कृतिः जनानां हृदयेभ्यः दुर्गुणान्, दुर्व्यसनानि, पापानि च निस्सार्य दूरीकरोति। सदाचार-शिक्षणेन च सा मानवमनांसि निर्मलानि सात्त्विकानि च करोति। ‘समन्वय-भावना’ अस्माकं भारतीयानां संस्कृतेः प्रमुखा विशेषता अस्ति। संस्कृतिरियं विश्वस्य सर्वेभ्यः मानवेभ्यः सौख्यम् उपदिशति। सर्वे भवन्तु सुखिनः सर्वे सन्तु निरामयाः। सर्वे भद्राणि पश्यन्तु मा कश्चिद्दुःखभाग्भवेत्॥','अस्माकं भारते पूर्वम् आर्यजनाः पापेभ्यः बिभ्यति स्म, सत्यं वदन्ति स्म, अहिंसाम् आचरन्ति स्म। ते दया-परोपकार-धैर्य-त्यागशीलता-सहानुभूत्यादि-नियमान् पालयन्ति स्म अत एव ते विश्ववन्द्याः आसन्। भारतीयाः जनाः शास्त्रोक्तानां धर्मनियमानां पालने मनसा वाचा कर्मणा संनद्धाः भवन्ति स्म। सत्यमिदं यत् संसारे यः कोऽपि स्वसंस्कृतिं त्यजति सः कदापि सुखी समृद्धश्च न भवति। अतः यदि वयं सुखं सम्मानं, समृद्धिं च इच्छामः तर्हि स्वभारतीयसंस्कृतेः सद्गुणाः अस्माभिः ग्रहणीयाः पालनीयाः एव।']},
 {t:'कविः कालिदासः',x:['संस्कृतसाहित्यम् अतिविस्तृतं वर्तते। अत्र नैके कवयः अनेकान् ग्रन्थान् विरचितवन्तः परं न हि तैर्लिखितं सर्वं साहित्यम् इदानीं प्राप्यते। केवलं अङ्गुलिगण्या एव कवयः एतादृशाः सन्ति, येषां नाम अद्यापि आदरपूर्वकं गृह्यते, मुहुर्मुहुश्च तेषां साहित्यं पठ्यते। एतादृश एव कविः कालिदासोऽस्ति, यो हि आलोचकैः कविकुलगुरुः इत्युपाधिना समलङ्क्रियते।','कालिदासः भारतवर्षस्य कस्मिन् प्रदेशे कस्मिंश्च काले जन्म लेभे इत्यादिप्रश्नाः अद्यावधि असमाहिताः एव। विद्वांसः ख्रैस्तीयप्रथमशताब्दीतः आरभ्य षष्ठशतकं यावत् कुत्रापि कालिदासस्य स्थितिं स्थापयन्ति। एवमेव तस्य जन्मस्थान-विषयेऽपि विवदन्ते। कालिदासस्य लोकप्रियतां वीक्ष्य कश्मीरवासिनस्तं कश्मीरप्रदेशे समुत्पन्नम्, बंगालवासिनश्च तं बंगप्रान्ते समुद्भूतम्, उज्जयिनीवासिनश्च कालिदासम् उज्जयिन्यां लब्धजन्मानं कथयन्ति।','महाकविना कालिदासेन सप्तग्रन्थाः विरचिताः, एतेषु रघुवंश-कुमारसम्भव-नामके द्वे महाकाव्ये, ऋतुसंहार-मेघदूत-नामके द्वे खण्डकाव्ये, अभिज्ञानशाकुन्तलम्, विक्रमोर्वशीयम्, मालविकाग्निमित्रञ्चेति त्रीणि नाटकानि सन्ति।','एतेषु सर्वेषु अभिज्ञानशाकुन्तलं नाम नाटकं तस्य सर्वस्वम् अभिधीयते। एतन्नाटकम् अधीत्यैव पाश्चात्त्याः संस्कृताध्ययनं प्रति समुत्सुका अभूवन्। कालिदासस्य साहित्ये सर्वत्र प्रकृतेश्चित्रणं वर्तते। मानवः यदा-यदा स्वकर्तव्यस्य अवहेलनां विदधाति तदा स शापं दण्डं च प्राप्नोति। प्रकृतिशरणं गत्वैव तस्य निष्कृतिर्भवति। शाकुन्तले दुर्वाससः शापमाध्यमेन, मेघदूते च यक्षकथामाध्यमेन कविरिदमेव मुहुर्मुहुरुपदिशति। कालिदासस्य रस भावसमन्विता वाणी कस्य मनो न हरति? कालिदासस्य अद्वितीयत्वमेव केनापि कविनोक्तम्— पुरा कवीनां गणनाप्रसङ्गे कनिष्ठिकाधिष्ठितकालिदासः। अद्यापि तत्तुल्यकवेरभावाद् अनामिका सार्थवती बभूव॥']},
 {t:'आदिकविः वाल्मीकिः',x:['महर्षिः वाल्मीकिः संस्कृतसाहित्यस्य आदिकविरस्ति। अयं मर्यादापुरुषोत्तमस्य रामस्य चरितवर्णनाय ‘रामायणम्’ नाम आर्षकाव्यम् अरचयत्। रामायणस्य फलश्रुत्यध्याये रामायणस्य कर्तृत्वेन वाल्मीकेः उल्लेखः प्राप्यते। क्रौञ्चद्वन्द्वस्य एकं व्याधेन व्यापादितं दृष्ट्वा अस्य कवेः मनसि समुत्थितः शोकः एव श्लोकरूपेण आविर्भूतः। उक्तञ्च— क्रौञ्चद्वन्द्ववियोगोत्थः शोकः श्लोकत्वमागतः।','आदिकविरयम् ऋषेः प्रचेतसः दशमः पुत्र आसीत्। अयं जात्या ब्राह्मणः राज्ञो दशरथस्य च मित्रमासीत्। मुनेर्वाल्मीकेः आश्रमे दशसहस्रसंख्याकाः छात्राः उषित्वा शिक्षामगृह्णन्। अस्याश्रमः गङ्गायाः तमसानद्याश्च तीरे आसीत्। वाल्मीकेः आश्रमविषये इदमपि मतं प्राप्यते यत् अस्याश्रमः यमुनायास्तटे चित्रकूटस्य समीपे आसीत्। तत्रैव उषित्वा वाल्मीकिः रामायणस्य रचनामकरोत्।','वाल्मीकिना विरचितं ‘रामायणम्’ लोकेऽस्मिन् सर्वतो मधुरम्, लोकप्रियम्, सर्वतश्चाधिकं हृदयस्पर्शि ऐतिहासिकं काव्यमस्ति। अस्मिन् रामस्य कथां वर्णयित्वा कविना लोकसमक्षम् एकः आदर्शः प्रस्तुतीकृतः यत् ‘रामादिवद् प्रवर्तितव्यं न रावणादिवत्’।','रावणः सीतायाः अपहरणम् अकरोत् अतः तस्य समूलं नाशोऽभवत्। रामः रामायणस्य सर्वगुणसम्पन्नः आदर्शनायकोऽस्ति। रामस्य चरितानि पठित्वा जनाः स्वकर्तव्यस्य, लोकव्यवहारस्य शौर्यस्य च शिक्षां गृह्णन्ति। इयं रामायणी कथा इयती रुचिपूर्णा अस्ति यत् जावा-सुमात्रा-बोर्नियो-बाली-चम्पा-थाईलैंडप्रभृतिदेशेषु सर्वत्र प्रचारमलभत। परवर्तिभिरनेकैः महाकविभिः अस्य कथामवलम्ब्य अनेकानि काव्यानि नाटकानि च विरचितानि। अत एव इदं महाकाव्यं चिरस्थायिनीं कीर्तिमलभत। अत एवोच्यते— यावत् स्थास्यन्ति गिरयः सरितश्च महीतले। तावद् रामायणी कथा लोकेषु प्रचलिष्यति॥']},
 {t:'भगवद्गीता',x:['अयं ग्रन्थः महर्षिणा वेदव्यासेन रचितस्य महाग्रन्थस्य महाभारतस्य अङ्गभूतः अस्ति। महाभारतयुद्धकाले यदा अर्जुनः मोहग्रस्तः युद्धविरतः च अभवत् तदा श्रीकृष्णेन यत्किञ्चिदुपदिष्टं तत् गीता-ग्रन्थरूपेण प्रसिद्धम्। अस्मिन् कर्म-ज्ञान-सांख्य-योगानां विषये उपदेशः विद्यते। कर्मयोगः गीतायाः प्रमुखः उपदेशः अस्ति। अत एव अस्य ग्रन्थस्य अपरं नाम ‘कर्मयोगशास्त्रम्’ अपि अस्ति। अस्य मननं कृत्वा मनुष्यः कर्मयोगी भवति। सः मनसा इन्द्रियैः शरीरेण च क्रियमाणेषु कर्मसु कर्तृत्वाभिमानं त्यजति। अयं ग्रन्थः संन्यासं नोपदिशति अपितु ‘योगः कर्मसु कौशलम्’ इत्युपदिशति। गीतायां निष्कामकर्मणः विशिष्टं महत्त्वम् अस्ति— “कर्मण्येवाधिकारस्ते मा फलेषु कदाचन”।','अस्मिन् ग्रन्थे भगवता श्रीकृष्णेन उपदिष्टम् यत्— आत्मा नित्यः शरीराणि च अनित्यानि। अतः मरणात् न भेतव्यम्। नरः वीरो भूत्वा अन्यायस्य प्रतीकारं कुर्यात्। एवं प्रकारेण गीता सर्वान् मनुष्यान् सर्वेषु लौकिककर्मसु कौशलम् शिक्षयति। अर्जुनः उपदेशेन नष्टमोहो भूत्वा कृष्णस्य धर्मयुद्धे प्रवृत्तः अभवत्। गीतायाः उपदेशसारं प्राप्य मनुष्यः आसुरीं सम्पदं परित्यज्य दैवीं सम्पदम् अर्जितुम् प्रवृत्तो भवति। अतः सर्वैः लोकैः गीतोपदेशम् अनुकृत्य जीवनम् सफलं कर्त्तव्यम्। गीताविषये केनापि कविना सत्यमुक्तम्— गीता सुगीता कर्त्तव्या किमन्यैः शास्त्रविस्तरैः।']},
 {t:'हिमालयः',x:['भारतभूखण्डोपरि प्रकृतेः महती अनुकम्पा वर्तते। नाना पर्वतमालाः विभिन्नाः सरितः नैकानि वनानि, द्वे सागरे, मरुस्थली च अत्र राजन्ते। एकस्मिन्नेव समये नैके ऋतवः अपि द्रष्टुं शक्यन्ते। यद्येकत्र ग्रीष्मातपप्रचण्डता दृश्यते, तदा अन्यत्र हिमाच्छादितत्वात् शैत्यप्रकोपोऽप्यनुभूयते। अस्मिन् भारतवर्षे ये प्राकृतिक-सीमानः सन्ति तेषु उत्तरस्यां दिशि हिमालयस्य प्रामुख्यं वर्तते।','भारतवर्षस्य उत्तरे दिग्विभागे अवस्थितेयं विशाला पर्वतमाला। कश्मीरादारभ्य अरुणाचलप्रदेशं यावत् अतिविस्तृतेयं पर्वतशृङ्खला अनादिकालात् भारतं रक्षितवती। न कोऽपि शत्रुः इमाम् उल्लङ्घ्य भारतं प्राविशत्, केवलं विगते शताब्दे चीनदेश एव एतादृशं दुःसाहसं कर्तुम् अपारयत्।','हिमालय एव उत्तरभारतस्य पिपासां शमयति विशालं कृषिक्षेत्रं च सिञ्चति। अस्य हिमाच्छादितत्वाद् गङ्गा-यमुना-शतद्रु-व्यास-वितस्तादयः सरितः सततं निस्सरन्ति। अस्माकं देशः ‘हिन्दुस्तान’ इति नाम्नापि व्यवह्रियते, अत्र यत् हिन्दू इति पदं वर्तते तत् सिन्धु इति शब्दान्निष्पन्नम्। सिन्धुनदी अपि हिमालयादेव प्रभवति।','चिरात् नाना कवयः स्वीयरचनासु हिमालयं वर्णितवन्तः। कालिदासेन तु स्वीये कुमारसम्भवे अयं हिमालयः देवभूमिरूपेण इत्थं वर्णितः— अस्त्युत्तरस्यां दिशि देवतात्मा हिमालयो नाम नगाधिराजः। पूर्वापरौ तोयनिधीवगाह्य स्थितः पृथिव्या इव मानदण्डः॥','हिमालयप्रदेशे एव अस्माकं पुरातनतीर्थानि सन्ति अत्रैव शङ्कराचार्येण स्थापितम् ‘केदारनाथ’ इति तीर्थस्थानं वर्तते। यमुनोत्री-गंगोत्री-बदरीनाथ-प्रभृतीनि पवित्राणि स्थानान्यपि अत्रैव वर्तन्ते। नैकऋषिजनानाम् इयं जन्मभूमिः। अत्रैवासीत् कण्वस्य तपोवनम्। आयुर्वेदस्य उपयोगाय औषधजातानि वनस्पतयश्च अस्मादेव प्राप्यन्ते। योगिनः अपि तपः साधनां कर्तुम् अत्रैव गच्छन्ति। भारते भावनात्मकम् ऐक्यं स्थापयितुं हिमालयस्य महत्त्वपूर्णं योगदानं वर्तते।']},
 {t:'जननी जन्मभूमिश्च स्वर्गादपि गरीयसी',x:['संसारेऽस्मिन् जननी अस्मभ्यं यानि यानि सुखानि प्रयच्छति, जन्मभूमिश्च तथैव सौविध्यानि ददाति। जन्मदात्री माता जन्मभूमिश्च स्वर्गाद् अपि श्रेष्ठा वरिष्ठा च वर्तते। माता कुमाता कदापि न भवति। सा जन्मन प्रभृति अतीव निश्छलप्रेम्णा पुत्रं पुत्रीं च लालयति, पालयति, स्वदुग्धं पाययित्वा शिशुं वर्धयति स्वयं च महत्कष्टानि अनुभूय तं सुखयति, महद्भयाच्च रक्षति। शीतर्तौ रात्रिकालेषु बालस्य मूत्रेण आर्द्रीभूताऽपि विष्टरे स्वयं स्वपिति, परन्तु बालं तु शुष्कस्थाने शय्यायां स्वापयति। किमधिकं माता स्वसन्ततिसुखाय रक्षणाय च स्वदुर्लभप्राणानपि दातुम् उद्यता भवति। अतः सत्यमिदं कथितं यत् जननी स्वर्गादपि अधिकं सुखं प्रयच्छति। भासस्य कथनानुसारेण माता किल मनुष्याणां देवतानाम् च दैवतम्।','वस्तुतः जन्मभूमिः जननीवत् अस्मान् सर्वान् नानाविधानि अन्नानि, फलानि च दत्त्वा यावज्जीवनं पालयति पोषयति संवर्धयति च। भूमिः अस्मभ्यं धनं, धातून्, रत्नानि च प्रयच्छति। जन्मदात्री कतिचिद्वर्षानन्तरं स्वकर्तव्यं पूरयित्वा निवृत्ता भवति; किन्तु जन्मभूमिः अस्माकं जीवनस्य अन्तिमं क्षणं यावत् स्वान्नजलफलादिभिः अस्मान् पोषयति। वयं च अन्तिमं श्वासम् अत्रैव नयामः। पशुपक्षिषु अपि स्वमातृभूमिं प्रति स्नेहभावः दृश्यते। मानवः तु विशेषरूपेण विवेकशीलः मनस्वी च वर्तते। अतः मातृभूम्यै तस्य स्नेहः स्वाभाविकः। सुष्ठूक्तम् अथर्ववेदेऽपि “माता भूमिः पुत्रोऽहम् पृथिव्याः”। खगाः अपि स्वदेशभूमिं बहु स्निह्यन्ति— अस्ति यद्यपि सर्वत्र नीरं नीरजमण्डितम्। रमते न मरालस्य मानसं मानसं विना॥','चन्द्रशेखर-भगतसिंह राजगुर्वादयः देशभक्ताः जन्मभूमिस्वतन्त्रतायै स्वकीयान् प्राणान् दत्त्वा अमराः जाताः। मातृभूमेः सीमां परिरक्ष्य सैनिकाः जन्मभूम्याः ऋणात् मुक्ताः भवन्ति। स्वर्णमयीं लङ्कां विजित्य रामः लक्ष्मणम् अवदत्— अपि स्वर्णमयी लङ्का, न मे लक्ष्मण रोचते। जननी जन्मभूमिश्च स्वर्गादपि गरीयसी॥']},
 {t:'प्रियं मे भारतम्',x:['अस्माकं प्रियं भारतम् ‘आर्यावर्तः’ ‘भारतवर्षम्’ ‘हिन्दुस्तान’ ‘इण्डिया’ इति चतुर्भिः नामभिः प्रसिद्धम् परन्तु सम्प्रति जनैः अस्य नाम ‘भारतम्’ इत्येव स्वीकृतम्।','भारतं कश्मीरात् कन्याकुमारीपर्यन्तं सुविस्तृतं राजते। अस्य मुकुट इव नगाधिराजः हिमालयः उत्तरस्यां दिशि शोभते। दक्षिणे चास्य हिन्दमहासागरः विद्यते।','अद्यत्वे भारते अष्टाविंशतिः राज्यानि सन्ति, तानि सर्वाण्यपि प्रादेशिक-विधानसभाभिः सञ्चाल्यन्ते। दिल्लीनगरं भारतस्य राजधानी केन्द्रं चास्ति। केन्द्रीयं शासनं सांसदैः संचाल्यते। सांसदबहुसंख्याकदलेन मन्त्रिमण्डलं निर्मीयते। सर्वोपरि राष्ट्रपतिः देशस्य शासनं करोति। किं बहुना भारतं सर्वोच्चसत्तासम्पन्नं प्रजातन्त्रात्मकं गणराज्यमस्ति।','भारते विविधाः जातयः सम्प्रदायाः, धर्माः भाषाश्च परं सर्वे भारतीयाः परस्परं प्रेम्णा व्यवहरन्ति। अत्रत्याः गङ्गादिनद्यः सकलं जगत् पुनन्ति। अत्रैव अवतीर्णाः श्रीरामः, श्रीकृष्णः, महात्माबुद्धः, महावीरः, शङ्करादिमहामानवाः। अत्रैव रघुः, चन्द्रगुप्तः, अशोकः, विक्रमादित्यः, प्रभृतयः महान्तः शासकाः अभवन्। आधुनिककाले गान्धिः, जवाहरलालः, सुभाषः, चन्द्रशेखरः, मालवीयादयः महापुरुषाः अजायन्त। स्वकार्यैश्च भारतस्य महत्त्वं वर्धितवन्तः। राष्ट्रभक्तिः अस्माकं प्रथमं कर्तव्यम् अस्ति। अस्माभिः सर्वैरपि भारतस्य सेवा मनसा, वाचा कर्मणा च करणीया। सम्प्रदाय-जाति-भाषा-प्रदेशादिभेदकतत्त्वानि विस्मृत्य ऐक्यं विधाय भारतस्य रक्षा, उन्नतिः च कर्तव्या। भारतस्य वैशिष्ट्यं प्रतिपादयन् केनापि सत्यमेवोक्तम्— गायन्ति देवाः किल गीतकानि धन्यास्तु ते भारतभूमिभागे। स्वर्गापवर्गास्पदमार्गभूते भवन्ति भूयः पुरुषाः सुरत्वात्॥']},
 {t:'मैट्रो-रेलसेवा',x:['अतिविस्तृतानि महानगराणि असंख्यनिवासिभिः सङ्कुलानि भवन्ति। महानगरेषु जनाः स्वकार्यं कर्तुं दूरं गन्तुं विवशा भवन्ति। यद्यपि महानगरेषु नैके राजमार्गा भवन्ति, परं यथा-यथा जनसंख्या वर्धते, वाहनानामपि संख्या प्रवर्धते, तथा तथा गमनागमने कष्टं भवति, वाहनानां च आधिक्येन पर्यावरणमपि दूषितं भवति।','अतः एतस्समाधानाय यूरोप-देशेषु मैट्रोनामधारिणी उपनगरगामिनी तीव्रगतिका रेलसेवा प्रवर्तिता। मूलतः सा रेलसेवा ‘मैट्रो’ नाम्ना अभिधीयते। भूमौ खननं विधाय विशालभवनानाम् अधः सुरंगेषु रेलपट्टिकाः स्थाप्यन्ते, तदुपरि द्रुतगत्या रेलकाः धावन्ति।','दिल्लीनगरे प्रचलितायाः मैट्रोरेलसेवायाः द्वे स्वरूपे स्तः। मैट्रो-मार्गस्य प्रथमं स्वरूपं तु भूमेरुपरि, अपरञ्च भूम्यन्तः। इदानीं तु दिल्लीनगरं प्रतिवेशिनगरेषु यथा नोएडानगरं प्रति, गुरुग्रामं प्रति, गाजियाबादनगरं प्रति, फरीदाबादनगरं प्रति अपि मैट्रोरेलयानेन जनाः सुगमतया गमनागमनं कुर्वन्ति। वायुयानस्थानकं प्रति गम्यमानायाः तीव्रगामीमैट्रोसेवायाः प्रयोगं दैशिकाः, वैदेशिकाः च सानन्दं कुर्वन्ति।','साम्प्रतं सहस्रशो जनाः अल्पेनैव कालेन एकस्मात् स्थानाद् अपरत्र यान्ति। द्रुतगत्या प्रधावतः वातानुकूलितकक्षान् वीक्ष्य को जनः मैट्रोद्वारा यात्रां कर्तुं नेच्छति।']},
 {t:'स्वतन्त्रता-दिवसः',x:['अस्माकं भारतदेशः सप्तचत्वारिंशदुत्तर—नवशतैकसहस्रतमे (1947) वर्षे अगस्तमासस्य पञ्चदशदिनाङ्के स्वतन्त्रः अभवत्। दिनेऽस्मिन् प्रतिवर्षं सम्पूर्णे भारतवर्षे स्वतन्त्रतादिवसोत्सवः मन्यते। अयं दिवसः भारतीयेतिहासे स्वर्णाक्षरैः लिखितमस्ति यतः अस्मिन् एव दिवसे भारतवर्षः मुक्तो भूत्वा स्वातन्त्र्यम् अलभत। भारतस्य राजधान्यां दिल्लीनगरे स्वतन्त्रतादिवसोत्सवः विशेषरूपेण दर्शनीयः भवति। प्रातःकाले सप्तवादनसमये अपारजनसमूहः रक्तदुर्गस्य मुख्यद्वारे एकत्रितो भवति। महान्तो नेतारः वैदेशिकाः अतिथयश्च मञ्चे उपविशन्ति। भारतस्य प्रधानमन्त्री त्रिवर्णात्मिकां राष्ट्रपताकाम् आरोहयति, ततः ‘जन-गण-मन’ इति राष्ट्रगीतं गीयते, पश्चाच्च प्रधानमन्त्री देशवासिनः सन्दिशति। दूरदर्शनेन एतेषां कार्यक्रमाणाम् प्रसारणं भवति येन दूरस्थाः अपि जनाः सोल्लासम् कार्यक्रमान् पश्यन्ति।','दिवसेऽस्मिन् न केवलं राजधान्यामेव अपितु सर्वेषु प्रदेशेष्वपि विविधानि कार्यक्रमाः आयोज्यन्ते, यथा कविभिः देशभक्तिपराः कविताः पठ्यन्ते, वीररसमयानि गीतानि गीयन्ते, स्वतन्त्रता-संग्रामसेनानिनः स्मर्यन्ते, क्रीडा-भाषण-प्रतियोगिताः समायोज्यन्ते, अन्ते च मिष्टान्नानि वितीर्यन्ते। राष्ट्रपर्व इदं सर्वेषु भारतीयेषु नवोत्साहं, नवां कल्पनाञ्च जनयति। अत एव अवसरेऽस्मिन् अस्माभिः सर्वैरपि प्रतिज्ञा कर्त्तव्या यद् शरीरेण, मनसा, धनेन, प्राणार्पणेनापि भारतमातुः सेवां सदा करिष्यामः।']}

const $=(s,r=document)=>r.querySelector(s);

const DN='०१२३४५६७८९';
const dn=n=>String(n).replace(/\d/g,d=>DN[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem('vv:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('vv:'+k,JSON.stringify(v))}catch(e){}}};
const seg=typeof Intl!=='undefined'&&Intl.Segmenter?new Intl.Segmenter('hi',{granularity:'grapheme'}):null;
const graphemes=s=>seg?[...seg.segment(s)].map(x=>x.segment):[...s];
/* highlight the part of each form after the common stem */
function markTable(rows){
  const all=[];rows.forEach(r=>r.forEach(c=>c.split(' / ').forEach(x=>all.push(x.replace(/^हे /,'')))));
  const gs=all.map(graphemes);let k=0;
  while(gs.every(g=>g.length>k&&g[k]===gs[0][k]))k++;
  return c=>c.split(' / ').map(x=>{const pre=x.startsWith('हे ')?'हे ':'';const g=graphemes(x.slice(pre.length));
    const a=g.slice(0,k).join(''),b=g.slice(k).join('');return esc(pre+a)+(b?`<span class="end">${esc(b)}</span>`:'')}).join(' / ');
}

function nav(){

function go(id,opts){
  if(!RENDER[id])id='home';

const TR_V=[['ai','ai'],['au','au'],['aa','ā'],['A','ā'],['ii','ī'],['I','ī'],['uu','ū'],['U','ū'],['RRi','ṛ'],['R^i','ṛ'],['RRI','ṝ'],['RR','ṝ'],['R','ṛ'],['LLi','ḷ'],['L','ḷ'],['a','a'],['i','i'],['u','u'],['e','e'],['o','o']];
const TR_C=[['kSh','क्ष'],['ksh','क्ष'],['GY','ज्ञ'],['jn','ज्ञ'],['kh','ख'],['gh','घ'],['~N','ङ'],['G','ङ'],['Ch','छ'],['chh','छ'],['ch','च'],['c','च'],['jh','झ'],['~n','ञ'],['J','ञ'],['Th','ठ'],['Dh','ढ'],['T','ट'],['D','ड'],['N','ण'],['th','थ'],['dh','ध'],['ph','फ'],['bh','भ'],['sh','श'],['Sh','ष'],['z','श'],['S','ष'],['k','क'],['g','ग'],['j','ज'],['t','त'],['d','द'],['n','न'],['p','प'],['b','ब'],['m','म'],['y','य'],['r','र'],['l','ल'],['v','व'],['w','व'],['s','स'],['h','ह']];
function translit(s){
  if(!/[a-zA-Z]/.test(s))return s;
  const ph=[];let i=0;
  while(i<s.length){
    if(s[i]==='M'||s[i]==='.'&&s[i+1]==='m'){ph.push('M');i+=s[i]==='M'?1:2;continue}
    if(s[i]==='H'||s[i]==='h'&&i===s.length-1&&i>0&&/[aeiouAIUR]/.test(s[i-1])){ph.push('H');i++;continue}
    if(s[i]==="'"||s[i]==='.'&&s[i+1]==='a'){ph.push("'");i+=s[i]==="'"?1:2;continue}
    let hit=null;
    for(const[k,v]of TR_C)if(s.startsWith(k,i)){hit=['c',k,v];break}
    if(!hit)for(const[k,v]of TR_V)if(s.startsWith(k,i)){hit=['v',k,v];break}
    if(!hit){ph.push(s[i]);i++;continue}
    i+=hit[1].length;
    if(hit[0]==='c'){const cs=toPh(hit[2]);cs.forEach(c=>{if(c!=='a')ph.push(c)});if(cs.length>1){/* conjunct letters */}}
    else ph.push(hit[2]);
  }
  // toPh-style array: consonants need explicit vowels; fromPh adds virama when no vowel follows
  return fromPh(ph);
}

const MS_LETTERS=[];SUTRAS.forEach((s,si)=>s.forEach((l,li)=>{if(li<s.length-1)MS_LETTERS.push({l,si,li})}));
function pratyahara(start,itSutra){
  const i0=MS_LETTERS.findIndex(x=>x.l===start);
  return MS_LETTERS.filter((x,i)=>i>=i0&&x.si<=itSutra);
}
function parsePratyahara(name){
  const it=name.slice(-2);const st=name.slice(0,-2);
  const i0=MS_LETTERS.findIndex(x=>x.l===st);if(i0<0)return null;
  const s0=MS_LETTERS[i0].si;
  if(name==='इण्')return{start:st,it:5};
  for(let s=s0;s<SUTRAS.length;s++)if(SUTRAS[s][SUTRAS[s].length-1]===it)return{start:st,it:s};
  return null;
}

/* ===== वाक्याभ्यास ===== */
function vakyaVerb(v,lak,p,n){
  const words=v.s.split(' ');const verb=words[words.length-1];
  const th=thematic(verb,v.lan);const idx=p<0?0:p*3+n;
  return th[lak][idx];
}

  </div>

    $$('[data-k]',el).forEach(b=>b.setAttribute('aria-pressed',+b.dataset.k===karta));

RENDER.abhyasa=el=>{
  const best=store.get('best',{});
  el.innerHTML=head('अभ्यास','परीक्षा','विषय चुनें — दस प्रश्न, हर प्रश्न के बाद व्याख्या। सर्वश्रेष्ठ अंक इसी ब्राउज़र में सहेजे जाते हैं।')+`
  <div class="topics">${Object.entries(QGEN).map(([k,v])=>`<button class="topic" data-t="${k}"><b>${v.t}</b><span>${v.s}</span><span>${best[k]!=null?'सर्वश्रेष्ठ: '+dn(best[k])+'/१०':'अभी तक नहीं'}</span></button>`).join('')}<button class="topic" data-t="mix"><b>मिश्रित</b><span>सभी विषयों से</span><span>${best.mix!=null?'सर्वश्रेष्ठ: '+dn(best.mix)+'/१०':'अभी तक नहीं'}</span></button></div>
  <div class="panel" id="qz" hidden></div>`;
  $$('[data-t]',el).forEach(b=>b.onclick=()=>start(b.dataset.t));
  function start(topic){
    const qs=[];const keys=Object.keys(QGEN);const seen=new Set();let guard=0;
    while(qs.length<10&&guard++<200){const k=topic==='mix'?rnd(keys):topic;const q=QGEN[k].g();if(q.o.length<4||seen.has(q.q))continue;seen.add(q.q);q.k=k;qs.push(q)}
    let i=0,score=0;const box=$('#qz');box.hidden=false;
    const show=()=>{
      if(i>=qs.length){const b=store.get('best',{});if(b[topic]==null||score>b[topic]){b[topic]=score;store.set('best',b)}
        box.innerHTML=`<div class="qcard"><div class="score">${dn(score)}<span style="font-size:1.4rem;color:var(--muted)">/१०</span></div><p class="sub">${score>=8?'उत्तम! आप यह विषय अच्छी तरह जानते हैं।':score>=5?'अच्छा प्रयास। तालिकाओं को एक बार और दोहराएँ।':'तालिकाएँ देखकर फिर प्रयास करें।'}</p><div class="row"><button class="btn" id="again">फिर से</button><button class="btn ghost" id="other">दूसरा विषय</button></div></div>`;
        $('#again').onclick=()=>start(topic);$('#other').onclick=()=>RENDER.abhyasa(el);box.scrollIntoView({block:'start',behavior:'smooth'});return}
      const q=qs[i];
      box.innerHTML=`<div class="qcard"><div class="row" style="justify-content:space-between"><span class="sub">प्रश्न ${dn(i+1)} / १० · ${QGEN[q.k].t}</span><span class="sub">अंक ${dn(score)}</span></div><div class="meter"><i style="width:${i*10}%"></i></div>
      <div class="qtext">${q.q}</div><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}" style="${q.plain?'font-family:var(--f-body);font-size:1rem':''}">${esc(o)}</button>`).join('')}</div><div id="fb"></div></div>`;
      $$('.opt',box).forEach(b=>b.onclick=()=>{const pick=q.o[+b.dataset.j];const ok=pick===q.a;if(ok)score++;
        $$('.opt',box).forEach(x=>{x.disabled=true;if(q.o[+x.dataset.j]===q.a)x.classList.add('ok')});if(!ok)b.classList.add('no');
        $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'सही!':'सही उत्तर: <span class="skt">'+esc(q.a)+'</span>'} — ${esc(q.x)}</div><div class="row" style="margin-top:10px"><button class="btn" id="nx">${i<9?'अगला प्रश्न':'परिणाम देखें'}</button></div>`;
        $('#nx').onclick=()=>{i++;show()};$('#nx').focus()});
    };
    show();box.scrollIntoView({block:'start',behavior:'smooth'});
  }
};

      <div class="panel letter"><div class="ptop">${tag('vv','अध्याय 12, पत्रम् '+dn(pi+1))}</div><div class="lt-to">${p.to.map(x=>`<div>${x}</div>`).join('')}</div>${p.sub?`<div class="lt-sub">${p.sub}</div>`:''}<div>${p.greet}</div>${p.body.map(x=>`<p>${x}</p>`).join('')}<div class="lt-from">${p.from.map(x=>`<div>${x}</div>`).join('')}</div>
      <div class="note" style="margin-top:14px;font-family:var(--f-body)">प्रारूप: ${p.to[0]==='सेवायाम्'?'औपचारिक पत्र — ‘सेवायाम्’, पदनाम और पता, विषयः, सम्बोधन (मान्यवराः / महोदयाः), निवेदन, धन्यवादाः, ‘भवतां विनीतः शिष्यः’ / ‘भावत्कः’, नाम, दिनाङ्कः।':'अनौपचारिक पत्र — ऊपर दाईं ओर प्रेषक का पता और दिनाङ्क, सम्बोधन (प्रिय मित्र / वन्दनीयाः पितृचरणाः), कुशल-समाचार, विषय, अन्त में ‘दर्शनाभिलाषी’ / ‘भवत्पुत्रः’ और नाम।'}</div></div></div>`;
      $$('[data-i]',B).forEach(b=>b.onclick=()=>{pi=+b.dataset.i;draw()})}
    if(tab==='vartta'){B.innerHTML=`<div class="panel from-vv"><div class="ptop">${tag('vv','अध्याय 12')}</div><h2>${DURABHASHA.t}</h2><p class="sub">${DURABHASHA.note}</p><div class="dialog">${DURABHASHA.lines.map(l=>`<div class="dl ${l[0]==='पिता'?'a':'b'}"><b>${l[0]}</b><span class="skt">${l[1]}</span></div>`).join('')}</div></div>`}
    if(tab==='apathita'){const a=APATHITA[ai];const types=['एकपदेन','पूर्णवाक्येन','यथानिर्देशम्'];const TN={'एकपदेन':'एकपदेन उत्तरत','पूर्णवाक्येन':'पूर्णवाक्येन उत्तरत','यथानिर्देशम्':'यथानिर्देशम् उत्तरत'};
      B.innerHTML=`<div class="row" style="margin:4px 0 12px">${APATHITA.map((x,i)=>`<button class="chip" data-a="${i}" aria-pressed="${i===ai}">गद्यांश ${dn(i+1)}</button>`).join('')}</div>
      <div class="panel"><div class="ptop">${tag('vv','अध्याय 12, गद्यांश '+dn(ai+1))}</div><p class="passage">${a.p}</p><h3 style="margin-top:6px">उपरिलिखितम् अनुच्छेदं पठित्वा प्रश्नान् उत्तरत—</h3>
      ${types.filter(t=>a.q.some(q=>q[0]===t)).map((t,ti)=>`<div style="margin-top:12px"><b>${['I','II','III'][ti]}. ${TN[t]}—</b><ol class="qs">${a.q.map((q,qi)=>[q,qi]).filter(x=>x[0][0]===t).map(([q,qi])=>`<li><span class="skt">${q[1]}</span> <button class="chip sm" data-s="${qi}">${show[ai+'-'+qi]?'उत्तर छिपाएँ':'उत्तर देखें'}</button>${show[ai+'-'+qi]?`<div class="ans">${tag('app','सुझाया उत्तर')} <span class="skt">${q[2]}</span></div>`:''}</li>`).join('')}</ol></div>`).join('')}
      <p class="sub" style="margin-top:12px">प्रश्न पुस्तक से हैं। पुस्तक में उत्तर नहीं दिए गए — यहाँ दिखाए उत्तर गद्यांश के आधार पर ऐप द्वारा सुझाए गए हैं।</p></div>`;
      $$('[data-a]',B).forEach(b=>b.onclick=()=>{ai=+b.dataset.a;draw()});$$('[data-s]',B).forEach(b=>b.onclick=()=>{const k=ai+'-'+b.dataset.s;show[k]=!show[k];draw()})}
    if(tab==='anu'||tab==='nib'){const L=tab==='anu'?ANUCHCHHEDA:NIBANDHA;const idx=tab==='anu'?ni:ai;const cur=L[Math.min(tab==='anu'?ni:ni,L.length-1)];
      const sel=tab==='anu'?ni:ni;const item=L[Math.min(sel,L.length-1)];const paras=Array.isArray(item.x)?item.x:[item.x];
      B.innerHTML=`${tab==='anu'?'<p class="sub" style="margin:4px 0 10px">किसी विषय के एक बिन्दु पर विचारों या भावों को एक स्थान पर क्रमबद्ध रूप से लिखना अनुच्छेद कहलाता है।</p>':''}<div class="explorer"><div class="picker panel"><h4>${tab==='anu'?'अनुच्छेद':'निबन्ध'} चुनें</h4>${L.map((x,i)=>`<button class="pick ${i===Math.min(sel,L.length-1)?'on':''}" data-n="${i}"><span class="skt">${x.t}</span></button>`).join('')}</div>
      <div class="panel"><div class="ptop">${tag('vv','अध्याय 12, '+(tab==='anu'?'अनुच्छेदलेखनम्':'निबन्धावली'))}</div><h2>${item.t}</h2>${paras.map(p=>`<p class="passage">${p}</p>`).join('')}${item.t.includes('मालवीय')?`<div class="note" style="margin-top:10px">पुस्तक में दिवंगत होने का वर्ष ‘1916’ छपा है; मालवीय जी का निधन 1946 में हुआ था, इसलिए यहाँ 1946 लिखा है।</div>`:''}</div></div>`;
      $$('[data-n]',B).forEach(b=>b.onclick=()=>{ni=+b.dataset.n;draw()})}
  };
  $$('#rt [data-t]',el).forEach(b=>b.onclick=()=>{tab=b.dataset.t;ni=0;draw()});draw();
};

/* ===== स्रोत-सूची ===== */
RENDER.srota=el=>{
  const rows=MODS.filter(m=>m.id&&SOURCES[m.id]);
  el.innerHTML=head('संदर्भ','स्रोत-सूची','ऐप का हर भाग किस पुस्तक के किस अध्याय या पाठ से लिया गया है। हर पृष्ठ के शीर्षक के नीचे यही स्रोत-चिह्न दिखते हैं, और शीघ्रबोध / सहजबोध से जोड़े गए खण्डों के बाईं ओर रंगीन पट्टी है।')+`
  <div class="grid3">${Object.entries(BOOKS).map(([k,b])=>`<div class="card src-card from-${k}">${tag(k)}<span class="ttl">${b.n}</span><span class="muted" style="font-size:.88rem">${b.d}</span></div>`).join('')}</div>
  <div class="panel"><h2>अध्याय-वार स्रोत</h2><div class="tw"><table><thead><tr><th>ऐप का भाग</th><th>स्रोत</th></tr></thead><tbody>${rows.map(m=>`<tr><th><button class="chip" data-go="${m.id}">${m.t}</button></th><td><div style="display:flex;flex-wrap:wrap;gap:6px">${SOURCES[m.id].map(x=>tag(x[0],x[1])).join('')}</div></td></tr>`).join('')}</tbody></table></div></div>
  <div class="panel from-sg"><div class="ptop">${tag('sg')}</div><h2>शीघ्रबोधव्याकरणम् से क्या-क्या लिया गया</h2><ul class="srclist">
   <li><b>वाक्याभ्यास</b> — सप्तम पाठ (पृ. 136–145) के सभी 303 वाक्य, धातु, हिन्दी अर्थ और लङ् रूप; पुस्तक के निर्देशानुसार कर्ता बदलकर अभ्यास (त्वम्, आवाम्, यूयम्, वयम्, सः, अहम्…)।</li>
   <li><b>धातुरूप → चार सार्वधातुक लकार अभ्यास-पट</b> — सप्तम पाठ (पृ. 122–129): √गम्, √वन्द् के लट्, लोट्, लङ्, विधिलिङ् रूप, प्रत्यय और कर्ता-सूची।</li>
   <li><b>विशेषण-समन्वय</b> — चतुर्थ पाठ (पृ. 74–82): नियम और श्लोक, संख्या-समन्वय, ‘शोभन बालक’ वाला क्रमिक उदाहरण, विशेषण-सूची, विभक्ति-क्रम से वाक्य-युग्म, बहु / सर्व / कति / कीदृश आदि, क्रियाविशेषण।</li>
   <li><b>अव्यय</b> — चतुर्थ पाठ (पृ. 82–84): ${SG_AVYAYA.length} अव्ययों की सूची, अव्यय के साथ विभक्ति, ‘तः’ प्रत्यय, निपात और वाक्य-प्रयोग।</li></ul></div>
  <div class="panel from-sb"><div class="ptop">${tag('sb')}</div><h2>अष्टाध्यायी सहजबोध से क्या-क्या लिया गया</h2><ul class="srclist">
   <li><b>संज्ञा → सहजबोध संज्ञावली</b> — प्रथम पाठ की ${SB_SANGYA.length} संज्ञा-प्रविष्टियाँ (धातु से बाहुलक तक) पुस्तक के क्रमांक, सूत्र और उदाहरण सहित; सुप् प्रत्यय तालिका; सूत्रों के छह प्रकार; बाध्यबाधकभाव; अङ्गकार्य-वर्णकार्य।</li>
   <li><b>वर्णविचार</b> — ४२ प्रत्याहारों की अनुबन्ध-वार तालिका; आभ्यन्तर और बाह्य प्रयत्न; करण; अयोगवाहों का स्थान।</li>
   <li><b>सन्धि → सूत्र-क्रम से सन्धि</b> — द्वितीय पाठ के ${SB_SANDHI.reduce((a,g)=>a+g.items.length,0)} सूत्र, आठ वर्गों में (अच् सन्धि के अपवाद — उपसर्गादृति धातौ, एङि पररूपम्, एत्येधत्यूठ्सु, आटश्च; श्चुत्व, ष्टुत्व, षत्व, णत्व, अनुस्वार-परसवर्ण, रुत्व-विसर्ग, जश्त्व-चर्त्व, भष्भाव, कुत्व, लोप, अनुनासिकान्त धातु)।</li></ul></div>
  <div class="panel from-tb"><div class="ptop">${tag('tb')}</div><h2>बिना शीर्षक वाले तालिका-पत्रक</h2><ul class="srclist"><li><b>prathama.pdf</b> → शब्दरूप पृष्ठ की ‘प्रथमा विभक्ति सारणी’ (चारों वर्ग, सम्बोधन और ‘इसी प्रकार’ शब्द-सूची सहित)।</li><li><b>PRATYAYA.pdf</b> → धातुरूप पृष्ठ की ‘तिङ् प्रत्यय’ तालिका और 18 तिङ् प्रत्यय।</li></ul></div>`;
};

/* ===== परीक्षा: सहजबोध संज्ञा प्रश्न ===== */
QGEN.sahaj={t:'संज्ञा (सहजबोध)',s:'सूत्र से संज्ञा पहचानें',g(){const s=rnd(SB_SANGYA.filter(x=>x[2]!=='—'));const c=s[1];return{q:`<span class="sutra">${esc(s[2])}</span> — यह किस संज्ञा का सूत्र है?`,a:c,o:opts4(c,SB_SANGYA.map(x=>x[1])),x:`${s[1]} — ${s[3]}`,plain:1}}};
QGEN.sbsandhi={t:'सन्धि-सूत्र (सहजबोध)',s:'उदाहरण से सूत्र पहचानें',g(){const g=rnd(SB_SANDHI);const r=rnd(g.items);const ex=r[3].split(';')[0];const c=r[0];return{q:`<span class="skt">${esc(ex)}</span> — किस सूत्र से?`,a:c,o:opts4(c,shuffle(g.items.map(x=>x[0])).concat(shuffle(SB_SANDHI.flatMap(x=>x.items.map(y=>y[0]))))),x:`${r[0]} (${r[1]}) — ${r[2]}`}}};

/* ===== boot ===== */
{const hash=(location.hash||'').slice(1);go(RENDER[hash]?hash:store.get('mod','home'));}

</script>
